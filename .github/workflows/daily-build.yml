name: Daily dataset refresh

on:
  schedule:
    - cron: "0 9 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Build dataset (FinMind source, top 500)
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          if [ -n "$FINMIND_TOKEN" ]; then
            python build_dataset.py --source finmind --top 500 --token "$FINMIND_TOKEN"
          else
            python build_dataset.py --source finmind --top 500
          fi

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/screened_dataset.csv data/dividend_history.csv data/build_log.txt
          git commit -m "chore: daily dataset refresh $(date -u +'%Y-%m-%d')"
          git push

      - name: Dump log on failure
        if: failure()
        run: cat data/build_log.txt || true
